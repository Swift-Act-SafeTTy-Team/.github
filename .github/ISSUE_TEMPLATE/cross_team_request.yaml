name: "Cross-Team Request / Issue Form"
description: "Submit a request for code, supporting scripts, bug fixes, or technical support to another team."
title: "R: "
labels: ["cross-team", "Request"]
body:
  - type: markdown
    attributes:
      value: |
        Please complete all required fields to help the receiving team triage and resolve your request as efficiently as possible.

  # ---------------------------------------------------------------------------
  # 1. General Information
  # ---------------------------------------------------------------------------
  - type: markdown
    attributes:
      value: "# 1. General Information:"

  - type: markdown
    attributes:
      value: "## Requesting Team"

  - type: dropdown
    id: requesting_team
    attributes:
      label: "</ul><h1>1. General Information:</h1> <ul><h2><li>Requesting Team</li></h2>"
      description: "Which team is asking for this work? (you can select more than one)"
      multiple: true
      options:
        - "ASI-01"
        - "ASI-02"
        - "ASI-03"
        - "PJM"
        - "Quality"
        - "platform"
    validations:
      required: true

  - type: markdown
    attributes:
      value: "## Target Team"

  - type: dropdown
    id: target_team
    attributes:
      label: "<h2><li>Target Team</li></h2>"
      description: "Which team needs to execute this request?"
      multiple: true
      options:
        - "Quality"
        - "platform"
    validations:
      required: true

  - type: markdown
    attributes:
      value: "## Request Type"

  - type: dropdown
    id: request_type
    attributes:
      label: "<h2><li>Request Type</li></h2>"
      multiple: true
      options:
        - "Bug Report"
        - "New Script / Feature"
        - "Support / Guidance"
    validations:
      required: true

  - type: markdown
    attributes:
      value: "## Priority Level"

  - type: dropdown
    id: priority
    attributes:
      label: "<h2><li>Priority Level</li></h2>"
      description: "Refer to team SLA guidelines before selecting priority."
      options:
        - "-- Please select --"
        - "P0 - Blocker (Immediate action needed)"
        - "P1 - High (Current Sprint)"
        - "P2 - Medium (Next Sprint)"
        - "P3 - Low (Nice to have)"
    validations:
      required: true

  - type: markdown
    attributes:
      value: "## Target Deadline / Sprint"     

  - type: input
    id: target_deadline
    attributes:
      label: "<h2><li>Target Deadline / Sprint</li></h2>"
      placeholder: "YYYY-MM-DD or Sprint #X"
    validations:
      required: false

  # ---------------------------------------------------------------------------
  # 2. Request / Issue Summary
  # ---------------------------------------------------------------------------
  - type: markdown
    attributes:
      value: "# 2. Request / Issue Summary:"

  - type: textarea
    id: description
    attributes:
      label: "<h1>2. Summary & Description:</h1><ul>"
      description: "Provide a clear, detailed summary of what is needed or what went wrong."
      placeholder: "e.g., We need an automated script to handle database migrations during the Feature X deployment..."
    validations:
      required: true

  # ---------------------------------------------------------------------------
  # 3. Technical Context & Impact
  # ---------------------------------------------------------------------------
  - type: markdown
    attributes:
      value: "# 3. Technical Context & Impact:"

  - type: markdown
    attributes:
      value: "## Main Repository Branches"

  - type: textarea
    id: main_repository_branches
    attributes:
      label: "</ul><h1>3. Technical Context & Impact:</h1> <ul><h2><li>Main Repository Branches</li></h2>"
      description: "Specify the relevant branch names across components (e.g., RDS, Config, Firmware, etc.)."
      placeholder: |
        - add all the repository branches - 
        e.g.,
        - RDS:      https://github.com/Swift-Act-SafeTTy-Team/RDS/tree/branch-name
        - Config:   https://github.com/Swift-Act-SafeTTy-Team/Config/tree/v1.2.0
        - please make sure to include all the relevant branches also with pictures -
    validations:
      required: true

  # ---------------------------------------------------------------------------
  # 4. Reproduction & Supporting Data
  # ---------------------------------------------------------------------------
  - type: markdown
    attributes:
      value: "# 4. Reproduction & Supporting Data:"

  - type: markdown
    attributes:
      value: "## Reproduction Steps (For Bugs)"

  - type: textarea
    id: reproduction_steps
    attributes:
      label: "</ul><h1>4. Reproduction & Supporting Data:</h1> <ul><h2><li>Reproduction Steps (For Bugs)</li></h2>"
      description: "Provide step-by-step instructions to reproduce the issue. Drag & drop screenshots into this box if applicable."
      placeholder: |
        1. Run command `...`
        2. Observe error output...
    validations:
      required: false

  - type: markdown
    attributes:
      value: "## Error Logs & Screenshots"

  - type: textarea
    id: logs_and_screenshots
    attributes:
      label: "<h2><li>Error Logs & Screenshots</li></h2>"
      description: "Paste stack traces, terminal output, or attach screenshots."
      placeholder: "Paste error output or logs here..."
    validations:
      required: false
      
  - type: checkboxes
    id: todo
    attributes:
      label: "</ul>"
      options:
        - label: Reported